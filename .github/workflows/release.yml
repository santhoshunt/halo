name: Release

# Pushing a tag such as v0.1.0 builds a signed APK and publishes it as a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # gradlew loses its executable bit when committed from Windows.
      - run: chmod +x gradlew

      - name: Decode keystore
        env:
          HALO_KEYSTORE_BASE64: ${{ secrets.HALO_KEYSTORE_BASE64 }}
        run: echo "$HALO_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/halo.jks"

      - name: Build signed APK
        env:
          HALO_KEYSTORE_PATH: ${{ runner.temp }}/halo.jks
          HALO_KEYSTORE_PASSWORD: ${{ secrets.HALO_KEYSTORE_PASSWORD }}
          HALO_KEY_ALIAS: ${{ secrets.HALO_KEY_ALIAS }}
          HALO_KEY_PASSWORD: ${{ secrets.HALO_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew assembleRelease -PhaloVersionName="$VERSION" -PhaloVersionCode=${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk "halo-$VERSION.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" halo-*.apk --generate-notes --title "Halo $GITHUB_REF_NAME"
